openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Claims Repository API
  version: 0.2.0
  summary: Deposit, retrieval, and constrained graph-pattern query of DAPPER claims.
  description: >-
    v0 contract for broadinstitute/claims-repository (build-plan Tasks 5 and 7).
    The service owns deposited DAPPER Claims; it never copies pipeline datasets.
    This REST contract covers deposit, retrieval, and meta endpoints (Task 5).
    The query surface (Task 7) is GraphQL, composed from api/graphql/core.graphql
    plus per-method schema modules shipped by claim templates; see
    docs/method-modules.md. Deposited documents are validated against the vendored DAPPER
    schema and stored under their DAPPER-ID-1 content addresses (POST /v1/deposits). Provenance
    for referenced dapper:File / dapper:GeneSet IDs is returned as references;
    resolution belongs to broadinstitute/provenance-indexer (Task 6 wires the
    join). All examples are synthetic fixtures: the deposit example's objects
    are valid DAPPER at their real addresses, the File, Activity and Agent it
    references (.SYNTH… ids) are placeholders, and no example value is a
    scientific result.
servers:
  - url: http://127.0.0.1:8100
    description: Local development server.
  - url: https://api-qa.hugeampkpnbi.org/api/claims
    description: QA deployment behind the dig-service-platform shared ALB (registered 2026-11-09, priority 60).
  - url: https://api-prod.hugeampkpnbi.org/api/claims
    description: Production (reserved; not a two-week promise).
tags:
  - name: Meta
    description: Liveness, pinned profile, and the queryable vocabulary (including identifier resolution).
  - name: Deposit
    description: >-
      Write path — POST /v1/deposits takes DAPPER objects of any class, or a whole DAPPER document, validated against
      the DAPPER schema and each object's DAPPER-ID-1 address. Idempotent by content address. Requires a depositor's
      X-API-Key; every accepted bundle is recorded as a deposit, and the deposit records are readable by anyone.
  - name: Objects
    description: The resolver — dereference ANY dapper ID (Claim, Proposition, ClaimScore, GeneSet, EvidenceItem, ValueLocator, File, Activity, ...) to its stored document. Content-negotiated (JSON / landing page).
  - name: GraphQL
    description: The constrained query surface, composed from core + per-method modules.
  - name: Jobs
    description: Requests answered in the background (?async=true on GraphQL and query runs).
  - name: Collections
    description: >-
      Registered collections of method results (docs/collections.md). Each
      describes itself (what it holds, its metrics and their meaning, its claim
      templates and queries) and runs its own query templates. Collections are
      published with scripts/publish_collection.py; a registration API is not
      yet built.
  - name: Auth
    description: >-
      Sign-in for the claims CLI by device code (RFC 8628; docs/cli-login.md). The CLI starts a sign-in, an admin
      approves its user code in the admin console, and the CLI exchanges the device code, once, for a publisher token
      (clp_ followed by 43 characters, 30 days) that it sends as a Bearer token. Only SHA-256 hashes are stored.
  - name: Publish
    description: >-
      Publishing a file-based collection's release into this service with a publisher token
      (docs/publishing-to-a-deployment.md). The publishing machine reads and checks the result files and sends what
      they hold, one dataset per request; the service computes every identifier, gene set, metric and mint context
      itself and stores them as scripts/publish_collection.py does. Bodies are JSON, gzip-encoded or not (at most
      16 MB as sent). Every request is idempotent; one that contradicts a recorded release is refused (409).
security: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [Meta]
      summary: Liveness and pinned-profile report
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, contract_version, dapper_profile]
                properties:
                  status: { type: string, enum: [ok] }
                  contract_version: { type: string, examples: ['0.1.0'] }
                  dapper_profile:
                    type: string
                    description: Pinned DAPPER release/commit used for validation.
                    examples: ['0.2.0-a1']
  /v1/auth/device:
    post:
      operationId: startDeviceLogin
      tags: [Auth]
      summary: Start a CLI sign-in
      description: >-
        Returns a secret device code for the CLI to poll with and a user code to approve at verification_uri. The
        code expires after expires_in seconds. At most 5 sign-ins per address may wait for approval at once (429).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { type: string, maxLength: 64, description: 'The CLI and its version, e.g. claims-cli/0.1.' }
                host: { type: string, maxLength: 255, description: 'The hostname the CLI runs on, shown to the approver.' }
      responses:
        '200':
          description: The sign-in was started.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                properties:
                  device_code: { type: string }
                  user_code: { type: string, examples: ['WDJB-MJHT'] }
                  verification_uri: { type: string, format: uri }
                  verification_uri_complete: { type: string, format: uri }
                  expires_in: { type: integer, examples: [600] }
                  interval: { type: integer, examples: [5] }
        '400': { description: 'client or host is not printable text.' }
        '429': { description: Too many sign-ins are waiting for approval. }
  /v1/auth/device/token:
    post:
      operationId: exchangeDeviceCode
      tags: [Auth]
      summary: Poll a CLI sign-in
      description: >-
        Until the sign-in is approved, 400 with error authorization_pending (or slow_down when polled faster than the
        interval). access_denied, expired_token and invalid_grant end it. Once approved, the publisher token is
        returned once and the device code is consumed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code: { type: string }
      responses:
        '200':
          description: The publisher token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, email, token_id, expires_at]
                properties:
                  access_token: { type: string, description: 'clp_ followed by 43 characters. Shown once.' }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  email: { type: string, description: The admin who approved the sign-in. }
                  token_id: { type: string, examples: ['tok_0123456789abcdef'] }
                  expires_at: { type: string, format: date-time }
        '400':
          description: Not (yet) a token.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [authorization_pending, slow_down, access_denied, expired_token, invalid_grant] }
                  error_description: { type: string }
  /v1/auth/whoami:
    get:
      operationId: whoami
      tags: [Auth]
      summary: Who a publisher token signs in as
      security: [{ PublisherToken: [] }]
      responses:
        '200':
          description: The token's holder and expiry.
          content:
            application/json:
              schema:
                type: object
                required: [email, token_id, expires_at]
                properties:
                  email: { type: string }
                  token_id: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { description: 'No valid publisher token: missing, unknown, expired or revoked (one answer for all).' }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the publisher token this request carries
      security: [{ PublisherToken: [] }]
      responses:
        '200': { description: The token is revoked. }
        '401': { description: No valid publisher token. }
  /v1/publish/{collection}/{version}:begin:
    post:
      operationId: beginPublish
      tags: [Publish]
      summary: Start or resume a push with the collection's files
      description: >-
        Body {files: {relative path: text}, prefix}: the manifest, templates, queries and vocabulary files, and the
        collection directory's path in its git repository (it is part of the files' File records). Answers the
        bundle digest the later requests name, the version's recorded release (if any) and the collection's current
        release.
      security: [{ PublisherToken: [] }]
      parameters:
        - { name: collection, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The bundle digest and the version's state. }
        '400': { description: The files are not a valid file-based collection named collection. }
        '401': { description: No valid publisher token. }
  /v1/publish/{collection}/{version}:check:
    post:
      operationId: checkPublish
      tags: [Publish]
      summary: Which datasets are stored and which mint contexts are recorded
      description: Body {datasets, contexts}, at most 50,000 ids each. Answers {stored, recorded}.
      security: [{ PublisherToken: [] }]
      parameters:
        - { name: collection, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The ids that are stored or recorded. }
        '401': { description: No valid publisher token. }
  /v1/publish/{collection}/{version}/datasets/{dataset_id}:
    put:
      operationId: putPublishDataset
      tags: [Publish]
      summary: Store one dataset from what its result files hold
      description: >-
        Body {bundle, dataset: {raw_dimensions, files: {role: File record}, where, was_generated_by}, extract:
        {edges: {kind: [[from value, to value]]}, rows: {kind: [{subject_value, object_value, row_json, spans}]}}}.
        The Dataset record these values make must have the id dataset_id. Stored in one transaction with the
        dataset's mint contexts; a dataset already stored has only its missing mint contexts recorded, and extract
        may then be null.
      security: [{ PublisherToken: [] }]
      parameters:
        - { name: collection, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: dataset_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The dataset''s counts: rows, edges, contexts, objects, already_stored.' }
        '400': { description: The values do not make this dataset, or a row breaks the collection's rules. }
        '401': { description: No valid publisher token. }
        '409': { description: A result file is already stored as another dataset with the same dimensions. }
        '413': { description: The body is too large. }
  /v1/publish/{collection}/{version}:finish:
    post:
      operationId: finishPublish
      tags: [Publish]
      summary: Record the release and make it the collection's current release
      description: >-
        Body {bundle, release, document, objects, provenance, code_version}. Every member dataset must be stored
        and its mint contexts recorded; the release's manifest, template and query files must be the bundle's and
        its predecessor the collection's current release. The release records who published it.
      security: [{ PublisherToken: [] }]
      parameters:
        - { name: collection, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The release id, and already_recorded when this version was recorded before. }
        '400': { description: The release is not what this push makes. }
        '401': { description: No valid publisher token. }
        '409': { description: The version is recorded with other content. }
  /v1/publish/objects/{collection}:register:
    post:
      operationId: registerObjectCollection
      tags: [Publish]
      summary: Register an object collection's definition
      description: >-
        Body {files: {relative path: text}, prefix, git_commit, replace}: an object collection's (kind: objects)
        manifest, query templates and vocabulary files, exactly the files the manifest names; the collection
        directory's path in its git repository (each File record's location is prefix/relative path); its commit
        (null when not in git, with -dirty when uncommitted); and whether to replace a different registered
        definition. The files are checked as `claims collection validate` checks them. Releases already opened keep
        the definition they were opened with. `claims objects register` sends this. Audited.
      security: [{ PublisherToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Collection'
      responses:
        '201': { description: 'Registered: {collection, status: registered, queries, files, git_commit}.' }
        '200': { description: 'status unchanged (this definition was registered; nothing written) or replaced.' }
        '400': { description: The files are not a valid object collection named collection. }
        '401': { description: No valid publisher token. }
        '409':
          description: >-
            Another definition is registered and replace is not set; or the files are a file collection's, or the
            key is a file collection's (publish those with `claims release publish --api`).
  /v1/vocabulary:
    get:
      operationId: getVocabulary
      tags: [Meta]
      summary: Enumerate queryable categories, predicates, methods, metrics, and phenotypes
      description: >-
        REST convenience surface: metric semantics for rendering scores with
        their meaning, and the phenotype list for trait autocomplete. GraphQL
        clients get the same information from schema introspection and the
        Query.methods field; this endpoint remains for non-GraphQL consumers.
      responses:
        '200':
          description: Current vocabulary.
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, categories, predicates, methods, metrics, phenotypes, collections]
                properties:
                  contract_version: { type: string }
                  categories:
                    type: array
                    items: { type: string }
                    examples: [['gene', 'phenotype', 'gene_set']]
                  predicates:
                    type: array
                    description: Allowed (subject category, predicate, object category) triples.
                    items:
                      type: object
                      required: [subject_category, predicate, object_category]
                      properties:
                        subject_category: { type: string }
                        predicate: { type: string }
                        object_category: { type: string }
                        methods:
                          type: array
                          items: { type: string }
                  methods:
                    type: array
                    items: { type: string }
                    examples: [['pigean']]
                  metrics:
                    type: object
                    description: Keyed by '<method>.<metric>'.
                    additionalProperties:
                      $ref: '#/components/schemas/MetricSemantics'
                  phenotypes:
                    type: array
                    description: >-
                      Phenotypes with loaded results, for autocomplete, resolved through the
                      KPN trait registry (broadinstitute/kpn-data-models).
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string, description: 'Canonical KPN trait ID when registered, else the key as loaded.', examples: ['KPN.TRAIT:0000505'] }
                        legacy_id: { type: [string, 'null'], description: 'Legacy portal key the result files use.', examples: ['IBD'] }
                        name: { type: [string, 'null'], examples: ['Inflammatory bowel disease (IBD)'] }
                        trait_group: { type: [string, 'null'], description: 'Trait group of the loaded result rows.', examples: ['portal'] }
                        category: { type: [string, 'null'], description: 'KPN trait category.', examples: ['digestive'] }
                        trait_type: { type: [string, 'null'], examples: ['disease'] }
                        concept_id:
                          type: [string, 'null']
                          description: Primary ontology concept from the KPN registry (all mappings via GraphQL Phenotype.mappings).
                          examples: ['EFO:0003767']
                  trait_registry:
                    type: [object, 'null']
                    description: The pinned KPN trait release the phenotypes resolve through (null when none is loaded).
                    properties:
                      source: { type: string, examples: ['broadinstitute/kpn-data-models'] }
                      version: { type: string, examples: ['v0.0.2'] }
                      published:
                        type: boolean
                        description: False when the publication check did not pass (possible only with --allow-unpublished; url then starts with 'unpublished:').
                      commit: { type: [string, 'null'] }
                      url: { type: string }
                      sha256: { type: string }
                      traits: { type: integer }
                      mappings: { type: integer }
                  collections:
                    type: array
                    description: Gene-set collections (the result files' gene_set_size tag).
                    items: { type: string }
                    examples: [['cfde-inc-v2']]
  /v1/objects:
    get:
      operationId: listObjects
      tags: [Objects]
      summary: List stored DAPPER objects (any class)
      description: >-
        Browse every stored dapper object — Claim, Proposition, ClaimScore,
        GeneSet, EvidenceItem, ValueLocator, File, Activity, ... — optionally
        restricted to one class. Compact summaries (id, class, one-line label,
        times_seen, resolver URL) in deterministic id order. Claims appear once
        asserted: when the scientific query surface (GraphQL) first serves the
        result behind them, or when a depositor deposits them via POST
        /v1/deposits.
      parameters:
        - { name: class_name, in: query, schema: { type: string }, example: Claim }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: One page of object summaries plus the filtered total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectSummaryPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '422':
          $ref: '#/components/responses/ParameterProblem'
  /v1/objects/search:
    get:
      operationId: searchObjects
      tags: [Objects]
      summary: Search stored DAPPER objects (any class)
      description: >-
        General search, not tied to any class. Filters are ANDed.
        `references` returns objects whose document points at the given dapper
        ID — e.g. class_name=Claim&references=<proposition id> is every claim
        assessing that proposition; references=<GeneSet id> is everything about
        that set. `q` is a word search of the statement / name / description
        text: every word of q must begin a word of ONE of those fields, in any
        order, case-insensitively (words are runs of letters and digits;
        punctuation and underscore separate them, and nothing is a wildcard).
        `nod2 bowel` finds "The gene NOD2 is associated with inflammatory bowel
        disease."; `od2` does not. `fields` limits which of the three are
        searched, and class_name keeps one class: together they make a search
        specific and fast (it runs on an index of those fields). A text search
        counts its matches up to 10,000: beyond that `total` is 10000,
        `total_capped` is true and pages stop there, so narrow it. One whose
        words are too short or too common to find in time is refused with 400
        and what to add.
        `match=slot:value` (repeatable) is exact equality on a top-level string
        slot, e.g. match=relation:has_members or match=subject_entity:NOD2.
        `deposited_by=<key id or login token id>` returns objects that depositor sent through
        a deposit, and `deposit=<deposit id>` the objects one deposit
        carried; objects the service minted when serving a query, or a loader
        wrote, belong to no deposit.
        Deliberately no numeric filters: questions about metrics belong to
        GraphQL (docs/inputs-and-outputs.md).
      parameters:
        - { name: class_name, in: query, schema: { type: string }, example: Proposition }
        - { name: deposited_by, in: query, schema: { type: string, pattern: '^(key|tok)_[0-9a-f]{16}$' }, description: "A depositor's key id, or a login's token id (400 if neither)." }
        - { name: deposit, in: query, schema: { type: string, pattern: '^dep_[0-9a-f]{32}$' }, description: 'A deposit id (400 if not one).' }
        - { name: references, in: query, schema: { type: string }, description: 'A dapper ID the matched objects reference (400 if not a dapper identifier).' }
        - { name: q, in: query, schema: { type: string, maxLength: 300 }, description: 'Words to find; each must begin a word of the statement, name, or description.' }
        - name: fields
          in: query
          description: "With q: which text fields to search (statement, name, description), comma-separated or repeated. Default all three."
          schema: { type: array, items: { type: string, enum: [statement, name, description] } }
          style: form
          explode: true
          example: [ statement ]
        - name: match
          in: query
          description: "Repeatable 'slot:value' exact match on a top-level string slot."
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          example: [ 'relation:associated_with' ]
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Matching object summaries plus the filtered total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectSummaryPage'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '422':
          $ref: '#/components/responses/ParameterProblem'
  /v1/deposits:
    post:
      operationId: deposit
      tags: [Deposit]
      summary: Deposit DAPPER objects of any class, validated
      description: >-
        The write path. Send exactly one of `document` — a DAPPER document, the
        shape dapper's own tooling mints: lists of nodes and edges under
        dapper's group names (claims, propositions, evidence_items, files,
        activities, scientific_accounts, used_edges, ...), so a whole
        ScientificAccount deposits in one request — or `objects`, a flat list
        of DAPPER nodes. Every node must be valid for its class in the DAPPER
        schema this service vendors (the response names its version): a
        class that can be deposited (not a mixin or abstract class), known
        slots only, required slots present, lists and single values where the
        schema says, a string, number or boolean as the slot's type says
        (dates and URIs are checked only to be strings) or a value of its
        enum, and references to a class the slot's range allows, written
        dapper:{Class}.{digest}. Its id must be the DAPPER-ID-1 address
        of its content, computed with dapper's identity module. Nodes are
        plain DAPPER: no `class_name` key is needed (the class is in the id),
        and null slots are dropped. Edges have no ids; they are validated
        against their edge class and stored with the deposit. Not checked:
        the schema's conditional rules, dapper's provenance lint profiles, and
        the inside of an inlined object. A bundle is stored whole or not at
        all, at most 1,000 objects, 5,000 edges and 16 MB (413 beyond that);
        send a larger document in parts. A busy store answers 503 with
        Retry-After, having stored nothing. Idempotent: an object
        already stored is `exists`. When a stored object has the same address
        but differs in slots identity ignores (a File's location, an
        Activity's timestamp), the first document stands and the outcome
        carries `stored_differs: true`; nothing stored is ever rewritten, and
        the deposit record keeps that this depositor held a different copy. If
        the stored object does not itself hash to that address, or differs in
        a slot identity does hash, the deposit is refused.
        References that resolve neither in the bundle nor in the store are
        reported in `unresolved_references`, not refused. Addresses the loaded
        data implies are RESERVED: a Claim deposited at one must equal the
        claim its data implies, else 400. Requires a deposit key (X-API-Key)
        or a `claims login` token (Authorization: Bearer clp_...), checked
        before the body is read; not both (400). A login token that is
        unknown, revoked or expired is 401. The accepted bundle is recorded as
        one deposit by that key or login.

        A deposit may name an object collection (`collection`) and one of its
        open releases (`release`; it may be left out while exactly one is
        open). Its objects are then stored exactly as without a collection,
        and also become members of that release, which the collection's named
        queries read once the release is closed. A key must have been
        granted the collection in the admin console (403 otherwise; a key
        without the grant can still deposit with no collection); a login may
        deposit into any object collection. A closed or
        unopened release answers 409. A catalog larger than one deposit goes
        in several: open the release, send the parts, close it; resending a
        part changes nothing. The receipt names the collection and release.
      security:
        - ApiKeyHeader: []
        - PublisherToken: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              pigeanGeneClaim:
                summary: Synthetic PIGEAN gene-phenotype claim bundle (real DAPPER-ID-1 objects, an index hint)
                externalValue: ./examples/deposit-bundle.request.json
              catalogPart:
                summary: One part of a catalog release
                value:
                  collection: dismech
                  release: "2026.11.0"
                  document:
                    knowledge_gaps:
                      - id: dapper:KnowledgeGap.zNV20nhHamt-a4CeAktQQPoAivOJe6xk
                        text: Are the CAD PGS x context interactions causal, or readouts?
                        gap_description: Contexts may be downstream readouts of disease.
                        gap_kind: KNOWLEDGE_GAP
                        scope: Coronary Artery Disease
                        about_entities: ["http://purl.obolibrary.org/obo/MONDO_0021661"]
            schema:
              type: object
              description: Exactly one of `document` and `objects`.
              properties:
                document:
                  type: object
                  description: A DAPPER document. Keys are dapper's node and edge group names; an unknown key is refused.
                  additionalProperties:
                    type: array
                    items: { type: object }
                objects:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/DapperObject'
                index_hints:
                  $ref: '#/components/schemas/IndexHints'
                collection:
                  type: string
                  description: An object collection whose open release these objects also join. A key needs a grant.
                  example: dismech
                release:
                  type: string
                  description: The open release (version) of `collection`; optional while exactly one is open.
                  example: "2026.11.0"
      responses:
        '200':
          description: >-
            Bundle accepted; per-object outcome reported. With a collection, the receipt's
            `collection` is {key, release, state, objects}; otherwise null.
          content:
            application/json:
              schema:
                type: object
                required: [deposit_id, depositor, deposited, edges, unresolved_references, validation]
                properties:
                  deposit_id: { type: string, examples: ['dep_0123456789abcdef0123456789abcdef'] }
                  depositor: { $ref: '#/components/schemas/Depositor' }
                  deposited:
                    type: array
                    items:
                      type: object
                      required: [id, class_name, status, times_deposited]
                      properties:
                        id: { type: string }
                        class_name: { type: string }
                        status: { type: string, enum: [created, exists] }
                        times_deposited: { type: integer }
                        stored_differs:
                          type: boolean
                          description: Present and true when the stored object at this address differs in slots identity ignores; the stored one was kept.
                  edges: { type: integer, description: Edges stored with this deposit. }
                  unresolved_references:
                    type: array
                    description: dapper ids the bundle references that are neither in it nor in the store.
                    items: { type: string }
                  validation:
                    type: object
                    properties:
                      identity_profile: { type: string, examples: ['DAPPER-ID-1'] }
                      dapper_version: { type: string, examples: ['0.2.1-a1'] }
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthProblem'
    get:
      operationId: listDeposits
      tags: [Deposit]
      summary: Who deposited what
      description: >-
        Deposit records, newest first: every deposit, the deposits that carried
        one object (`object=<dapper id>`), or the deposits one depositor sent
        (`deposited_by=<key id or login token id>`). Open like every read. A
        depositor is a key id and the name the key was issued under, or, for a
        `claims login`, {kind: login, name: claims login}: no key, token or
        email is served.
        Objects the service minted when serving a query, or a loader wrote,
        belong to no deposit.
      parameters:
        - { name: object, in: query, schema: { type: string }, description: 'A dapper ID (400 if not a dapper identifier).' }
        - { name: deposited_by, in: query, schema: { type: string, pattern: '^(key|tok)_[0-9a-f]{16}$' }, description: "A depositor's key id, or a login's token id (400 if neither)." }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Deposit records plus the filtered total.
          content:
            application/json:
              schema:
                type: object
                required: [total, limit, offset, deposits]
                properties:
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  deposits:
                    type: array
                    items: { $ref: '#/components/schemas/Deposit' }
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '422':
          $ref: '#/components/responses/ParameterProblem'
  /v1/deposits/{deposit_id}:
    get:
      operationId: getDeposit
      tags: [Deposit]
      summary: One deposit and the objects it carried
      description: >-
        The depositor, when it was received, every object it carried (created or exists, and
        stored_differs), its edges, and `collection`: {key, release, release_id, state} when the
        deposit named an object collection, else null. GET /v1/deposits lists the same `collection`.
      parameters:
        - { name: deposit_id, in: path, required: true, schema: { type: string, pattern: '^dep_[0-9a-f]{32}$' } }
      responses:
        '200':
          description: The deposit, with each object and whether this deposit created it or it already existed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Deposit'
                  - type: object
                    required: [objects, edges]
                    properties:
                      objects:
                        type: array
                        items:
                          type: object
                          required: [id, class_name, status]
                          properties:
                            id: { type: string }
                            class_name: { type: [string, 'null'] }
                            status: { type: string, enum: [created, exists] }
                            stored_differs: { type: boolean, description: "Present and true when this deposit's copy differed, in slots identity ignores, from the stored object, which was kept." }
                      edges:
                        type: array
                        description: The document edges this deposit carried, in order, each with its edge class.
                        items:
                          type: object
                          required: [class_name, subject, object]
                          properties:
                            class_name: { type: string, examples: [Used] }
                            subject: { type: string }
                            predicate: { type: string }
                            object: { type: string }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/objects:batchGet:
    post:
      operationId: batchGetObjects
      tags: [Objects]
      summary: Many stored objects in one call
      description: >-
        Up to 500 distinct ids (duplicates are counted once). Found documents come back keyed by id,
        presented as GET /v1/objects/{id} presents them; ids with no stored object are listed in
        `missing`. A plain read: a claim the loaded data implies but nothing has asserted is missing, and
        this call does not mint it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 500, items: { type: string } }
            example:
              ids: ["dapper:KnowledgeGap.zNV20nhHamt-a4CeAktQQPoAivOJe6xk", "dapper:Mechanism.kEJMDzCkDYE94DpWaXrQg-eC4gFGQyuX"]
      responses:
        '200':
          description: '{objects: {id: document}, missing: [id]}'
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects: { type: object, additionalProperties: { $ref: '#/components/schemas/DapperObject' } }
                  missing: { type: array, items: { type: string } }
        '400':
          description: Not a list of ids, empty, or more than 500.
  /v1/objects/{object_id}/lineage:
    get:
      operationId: objectLineage
      tags: [Objects]
      summary: An object's lineage as nodes and edges
      description: >-
        What the object references, followed to `depth` (1 to 3): every dapper id in its slots
        (was_derived_from, was_generated_by, has_evidence, ...) and the deposited edges it is the subject
        of (used_edges and other edge groups); and what references it, depth 1, from the reference
        index. Each edge names the slot or edge class it comes from (`kind` reference or edge). Nodes
        carry class, name, direction (self, outgoing, incoming), depth, and whether the object is stored.
        At most 500 nodes; `truncated` says the graph was cut. A plain read.
        Example: GET /v1/objects/dapper:KnowledgeGap.zNV20nhHamt-a4CeAktQQPoAivOJe6xk/lineage?depth=2
      parameters:
        - name: object_id
          in: path
          required: true
          schema: { type: string }
        - name: depth
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 3, default: 3 }
      responses:
        '200':
          description: '{id, depth, nodes: [{id, class_name, name, stored, direction, depth}], edges: [{from, to, label, kind}], truncated}'
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/objects/{object_id}:
    get:
      operationId: getObject
      tags: [Objects]
      summary: Dereference any DAPPER object by ID (the resolver)
      description: >-
        The URL form of any dapper CURIE: {base}/v1/objects/{id}. Returns the
        stored document for any object (Claim, Proposition, ClaimScore,
        GeneSet, GeneSetCollection, Activity, File, EvidenceItem,
        ValueLocator, ...) in a consistent presentation — id and class_name
        first, remaining keys sorted; content verbatim. Content-negotiated:
        Accept text/html returns a human landing page with every referenced
        dapper ID linked through this same resolver; JSON otherwise. The CURIE
        stays the canonical, content-addressed identifier — this URL is a
        presentation of it (see /v1/vocabulary identifier_resolution). A claim
        the data implies but nothing has served or deposited yet returns 404
        "not yet asserted"; the dereferenced claim envelope (scores, evidence,
        provenance) is GraphQL's claim(id).
      parameters:
        - name: object_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The stored document (JSON), or its landing page for Accept text/html.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DapperObject'
            text/html:
              schema: { type: string, description: 'Human landing page; referenced dapper IDs are resolver links.' }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/collections:
    get:
      operationId: listCollections
      tags: [Collections]
      summary: Every registered collection with its current release
      responses:
        '200':
          description: The collections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, examples: [pigean] }
                        title: { type: string }
                        description: { type: [string, 'null'] }
                        methods: { type: array, items: { type: string } }
                        current_release: { type: string, description: 'The DAPPER ResultCollection id.' }
                        version: { type: string }
                        datasets: { type: integer }
  /v1/collections/{collection}:
    get:
      operationId: describeCollection
      tags: [Collections]
      summary: What a collection holds and how to read it
      description: >-
        From the release manifest: releases, datasets with their dimension
        values and row counts, row and edge kinds, metrics with their meaning
        and scale, tier rules, claim templates, query names, and how many of
        the collection's claims have been minted.
      parameters:
        - $ref: '#/components/parameters/Collection'
        - { name: first, in: query, required: false, description: 'Datasets per page (0 to 500).', schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, required: false, description: 'First dataset of the page; datasets_page.next_offset gives the next.', schema: { type: integer, minimum: 0, default: 0 } }
        - name: release
          in: query
          required: false
          description: A version or release id; default the current release.
          schema: { type: string }
      responses:
        '200':
          description: The collection description.
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/queries:
    get:
      operationId: queryCatalog
      tags: [Collections]
      summary: Every query the repository answers, described for runQuery (start here)
      description: >-
        Returns {guide, queries}. `guide` explains how to call runQuery (GraphQL
        or REST), its arguments, and the shape of a result row, join item and
        claim envelope. Each entry in `queries` names a collection's query
        template and gives its params (type, default, bounds; a dimension param
        also gives a sample of its values and the URL that lists them all), the
        rows it returns (kinds, entities, metrics with their meaning, joins),
        the claim keys `claims` accepts, its plan, and a GraphQL and a REST
        request that run as given. Derived from each collection's current
        release manifest. GraphQL: `queries`.
      parameters:
        - name: collection
          in: query
          required: false
          description: Only this collection's queries.
          schema: { type: string }
        - name: release
          in: query
          required: false
          description: With `collection`, a version or release id instead of the current release.
          schema: { type: string }
      responses:
        '200':
          description: The guide and the query entries.
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/collections/{collection}/dimensions/{dimension}:
    get:
      operationId: collectionDimensionValues
      tags: [Collections]
      summary: The values a dataset dimension takes (what to pass for a dimension param)
      description: >-
        Each value with its label, the other keys a query accepts for it (a
        trait's legacy or PIGEAN key), and its number of datasets.
        GraphQL: `dimensionValues`.
      parameters:
        - $ref: '#/components/parameters/Collection'
        - name: dimension
          in: path
          required: true
          schema: { type: string }
        - name: search
          in: query
          required: false
          description: Case-insensitive match on value, label or accepted key.
          schema: { type: string }
        - name: first
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: release
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: '{collection, release, dimension, count, values: [{value, label, datasets, also_accepts}], truncated}'
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/collections/{collection}/releases:
    post:
      operationId: openObjectRelease
      tags: [Collections]
      summary: Open a release of an object collection
      description: >-
        An object collection (kind: objects) is registered from its directory (`claims objects register`,
        POST /v1/publish/objects/{collection}:register, or scripts/publish_collection.py). A key granted
        the collection, or a `claims login` (any collection), opens a release here, deposits into it
        (POST /v1/deposits with `collection` and `release`, in as many parts as needed), then closes it.
        `claims objects deposit` does all three. 201 when opened; 200 when it was already open. 409 if the
        version is closed. Send a key or a login token, not both (400).
      security:
        - ApiKeyHeader: []
        - PublisherToken: []
      parameters:
        - $ref: '#/components/parameters/Collection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
            example: { version: "2026.11.0" }
      responses:
        '201':
          description: '{collection, version, state: open, release_id: null, opened_at, closed_at: null}'
          content:
            application/json:
              schema: { type: object }
        '200':
          description: Already open; returned unchanged.
          content:
            application/json:
              schema: { type: object }
        '403':
          description: The key was not granted this collection.
        '401':
          $ref: '#/components/responses/AuthProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: That version is closed (or a file-based release of it exists).
  /v1/collections/{collection}/releases/{version}:
    get:
      operationId: objectReleaseStatus
      tags: [Collections]
      summary: An object collection release's state and contents
      parameters:
        - $ref: '#/components/parameters/Collection'
        - name: version
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '{collection, version, state, release_id, opened_at, closed_at, objects, classes: {class: n}, deposits}'
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/collections/{collection}/releases/{version}:close:
    post:
      operationId: closeObjectRelease
      tags: [Collections]
      summary: Close an object collection release
      description: >-
        Mints the release's DAPPER ResultCollection (one Dataset per class of member objects, each with
        a File listing their ids, plus the manifest and query template Files), records it, and makes it
        the collection's current release: its named queries now read it. Closing again returns it
        unchanged. The response adds `unresolved_references`: ids the members reference that this
        repository does not hold (the first 100). A key needs a grant for the collection; a login
        does not, and is recorded as the release's publisher.
        Example: POST /v1/collections/dismech/releases/2026.11.0:close
      security:
        - ApiKeyHeader: []
        - PublisherToken: []
      parameters:
        - $ref: '#/components/parameters/Collection'
        - name: version
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The release status, closed, with its release_id.
          content:
            application/json:
              schema: { type: object }
        '403':
          description: The key was not granted this collection.
        '401':
          $ref: '#/components/responses/AuthProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: The release holds no objects.
  /v1/collections/{collection}/releases/{version}/members:
    get:
      operationId: objectReleaseMembers
      tags: [Collections]
      summary: The member ids of one class in a closed object release
      description: The bytes of the release's members File for that class (one id per line); its sha256 is in the release document.
      parameters:
        - $ref: '#/components/parameters/Collection'
        - name: version
          in: path
          required: true
          schema: { type: string }
        - name: class
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: One dapper id per line.
          content:
            text/plain:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/collections/{collection}/queries:
    get:
      operationId: listCollectionQueries
      tags: [Collections]
      summary: A collection's entries from GET /v1/queries
      parameters:
        - $ref: '#/components/parameters/Collection'
        - name: release
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: '{collection, queries}: the same entries as GET /v1/queries, for one collection.'
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/collections/{collection}/queries/{name}:run:
    post:
      operationId: runCollectionQuery
      tags: [Collections]
      summary: Run a collection's query template
      description: >-
        Runs the named plan: the anchor step filters, orders and limits rows of
        one kind before any join (ties break by entity ascending), and each join
        keeps its own window per anchor. Each step filters and orders only on
        its own kind's metrics. Serving a row asserts its claims (minted on
        first serve, re-rendered and checked against their recorded ids on
        every serve); the assertions are written only if the whole response
        succeeded, as for GraphQL.
      parameters:
        - $ref: '#/components/parameters/Collection'
        - name: name
          in: path
          required: true
          schema: { type: string, examples: [top-genes-with-sets] }
        - $ref: '#/components/parameters/Async'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables: { type: object, description: "The query's parameters (see the queries listing)." }
                release: { type: string, description: 'A version or release id; default the current release.' }
                claims:
                  type: array
                  items: { type: string }
                  description: Claim keys to serve per row (default all; an empty list serves none).
            examples:
              ibd:
                value: { variables: { trait: IBD, priorMax: 0.5, topGenes: 20, setsPerGene: 5 } }
      responses:
        '200':
          description: Rows (each with its joined rows and claim envelopes) and warnings.
          content:
            application/json:
              schema: { type: object }
        '202':
          $ref: '#/components/responses/JobSubmitted'
        '429':
          $ref: '#/components/responses/JobsBusy'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/collections/{collection}/releases/{version}/document:
    get:
      operationId: collectionReleaseDocument
      tags: [Collections]
      summary: A release as a DAPPER document
      description: >-
        The ResultCollection with its Datasets, Files and Activities, lintable
        with dapper's `result-collection` profile.
      parameters:
        - $ref: '#/components/parameters/Collection'
        - name: version
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The DAPPER document.
          content:
            application/json:
              schema: { type: object }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/graphql:
    get:
      operationId: graphiql
      tags: [GraphQL]
      summary: GraphiQL explorer (HTML) with an example IBD query preloaded
      responses:
        '200':
          description: The GraphiQL page.
          content:
            text/html:
              schema: { type: string }
    post:
      operationId: graphql
      tags: [GraphQL]
      summary: The query surface (GraphQL)
      description: >-
        Standard GraphQL-over-HTTP endpoint executing api/graphql/core.graphql
        plus api/graphql/collections.graphql. Results are read only through
        collections: `queries` lists every query template with what it takes
        and returns, and `runQuery` runs one (the CFDE validation challenge is
        the pigean collection's top-genes-with-sets). There are no per-method
        fields. Introspection is enabled. Clients cannot write through GraphQL (no
        Mutation type; deposit stays on POST /v1/deposits), but serving a result
        MINTS the claim it implies: the claim is synthesized from its index row,
        verified, and recorded with every assertion in one batch after the whole
        response succeeded (docs/inputs-and-outputs.md §3.5).
      parameters:
        - $ref: '#/components/parameters/Async'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: 'GraphQL document.' }
                variables: { type: object }
                operationName: { type: string }
      responses:
        '202':
          $ref: '#/components/responses/JobSubmitted'
        '429':
          $ref: '#/components/responses/JobsBusy'
        '200':
          description: GraphQL response per the GraphQL-over-HTTP spec.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: [object, 'null'] }
                  errors:
                    type: array
                    items: { type: object }
                  extensions: { type: object }
        '400':
          description: >-
            Not JSON ({detail}), or a GraphQL request that failed validation or
            execution ({errors}, data null). A failed response writes nothing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
                  data: { type: [object, 'null'] }
                  errors: { type: array, items: { type: object } }
  /v1/jobs/{id}:
    get:
      operationId: queryJob
      tags: [Jobs]
      summary: A query job's state
      description: >-
        A request submitted with ?async=true: queued, running, done or failed,
        with result_url for its response. Jobs are kept in the service's
        process: a finished job's result is kept for an hour, and is lost if the
        service restarts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryJob' }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /v1/jobs/{id}/result:
    get:
      operationId: queryJobResult
      tags: [Jobs]
      summary: A query job's response
      description: >-
        Once the job finished, exactly the response the synchronous request
        would have given (its status and body: 200 with the result, or the
        request's error). While it runs, 202 with the job's state and a
        Retry-After header.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The synchronous request's response.
          content:
            application/json:
              schema: { type: object }
        '202':
          description: Still running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryJob' }
        '404':
          $ref: '#/components/responses/NotFoundProblem'
components:
  parameters:
    Async:
      name: async
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: >-
        true: run the request in the background and answer 202 at once with a
        job (Location: its URL); read the response from the job's result_url.
        For requests that may take longer than the gateway's 60 s. The work,
        the response and the claims it asserts are the synchronous request's.
    Collection:
      name: collection
      in: path
      required: true
      schema: { type: string, examples: [pigean] }
  securitySchemes:
    PublisherToken:
      type: http
      scheme: bearer
      description: >-
        A publisher token from `claims login` (POST /v1/auth/device, then /v1/auth/device/token): clp_ followed by 43
        characters, valid 30 days, revocable in the admin console or with POST /v1/auth/logout.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        A depositor's key (clm_ followed by 43 characters), for POST /v1/deposits and an object collection's open
        and close (a `claims login` token may be sent instead). Keys are issued and revoked by an operator, in the
        admin console or with scripts/api_key.py; the service stores only a key's SHA-256. Read endpoints are open.
  responses:
    JobSubmitted:
      description: Submitted with ?async=true; the job's state, its URL in Location.
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueryJob' }
    JobsBusy:
      description: Too many jobs are waiting; try again after Retry-After seconds.
      content:
        application/json:
          schema: { type: object, properties: { detail: { type: string } } }
    ValidationProblem:
      description: >-
        The request failed validation (malformed JSON, invalid identifier,
        reserved address, unsupported index hint, ...). `detail` says why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ParameterProblem:
      description: A query parameter is out of range or of the wrong type (FastAPI validation).
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: array, items: { type: object } }
    AuthProblem:
      description: >-
        The X-API-Key header is missing, is not a key, or names an unknown or revoked key; or a `claims login`
        token (Authorization: Bearer clp_...) is unknown, revoked or expired. The answer is the same in every case
        for that credential, and nothing was stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: >-
        No stored object with that ID. For a claim the loaded data implies but
        nothing has served or deposited yet, `detail` says it is "not yet
        asserted".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    QueryJob:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [graphql, query] }
        status: { type: string, enum: [queued, running, done, failed] }
        url: { type: string }
        result_url: { type: string }
        request: { type: object }
        submitted_at: { type: string }
        started_at: { type: [string, 'null'] }
        finished_at: { type: [string, 'null'] }
        seconds: { type: number }
        expires_at: { type: [string, 'null'] }
        http_status: { type: [integer, 'null'] }
    Problem:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: Human-readable reason. }
    DapperObject:
      type: object
      description: >-
        A DAPPER document of any class. The vendored DAPPER schema — not this
        contract — is the schema authority; this shape only names the ID.
        Deposited objects are plain DAPPER nodes at DAPPER-ID-1 addresses,
        validated on the way in (POST /v1/deposits). The class is part of the
        id; responses also give it as `class_name`, and a deposit may include
        `class_name` only if it agrees with the id. Objects a loader wrote may
        carry local-dev ids (dapper:{Class}.local<hex>); those are served but
        cannot be deposited.
      required: [id]
      properties:
        class_name: { type: string, description: 'The DAPPER class (Claim, Proposition, ClaimScore, EvidenceItem, ValueLocator, GeneSet, File, Activity, ScientificAccount, ...).' }
        id: { type: string, description: 'DAPPER content address, dapper:{ClassName}.{digest}: a 32-character base64url digest for DAPPER-ID-1.' }
      additionalProperties: true
    IndexHints:
      type: array
      description: >-
        Optional. Each declares the graph edge of one Claim (in this deposit or already stored) for the PIGEAN
        index, so indexing never guesses entity categories from proposition text. A hint may not overwrite a loaded row.
        Legacy: since 2026-11-18 no query reads the PIGEAN index (results are read through collections), so a
        hint only records the edge; the deposited claim itself is served by claim(id) and /v1/objects either way.
      items:
        type: object
        required: [claim_id, method, predicate, subject, object]
        properties:
          claim_id: { type: string }
          method: { type: string, examples: [pigean] }
          predicate: { type: string, examples: [associated_with, member_of] }
          subject:
            $ref: '#/components/schemas/EntityRef'
          object:
            $ref: '#/components/schemas/EntityRef'
          collection: { type: string, examples: [cfde-inc-v2] }
          trait_group: { type: string, examples: [portal] }
    EntityRef:
      type: object
      required: [category, id]
      properties:
        category: { type: string, enum: [gene, phenotype, gene_set] }
        id: { type: string, description: 'Canonical ID for the category: HGNC symbol, portal trait key, or full gene-set name.' }
    MetricSemantics:
      type: object
      required: [score_kind, scale, better, description]
      properties:
        score_kind:
          type: string
          enum: [PROBABILITY, POSTERIOR_PROBABILITY, EFFECT_ESTIMATE, LOADING, SCORE]
        scale: { type: string, examples: ['log posterior odds'] }
        better: { type: string, enum: [higher, lower] }
        description: { type: string }
    Depositor:
      type: object
      description: >-
        Who sent a deposit. Public: a key's id and the name it was issued under, or, for a `claims login`, only
        {kind: login, name: claims login}; no key, token or email is served. (The receipt of a login's own deposit
        adds its email and token_id; the admin console shows them.)
      required: [name]
      properties:
        key_id: { type: string, examples: ['key_0123456789abcdef'] }
        kind: { type: string, enum: [login], description: Present for a login's deposit. }
        name: { type: string, description: 'The name the key was issued under, or "claims login".', examples: ['REVEAL agent service (QA)'] }
        email: { type: string, description: Only in the receipt of a login's own deposit. }
        token_id: { type: string, description: Only in the receipt of a login's own deposit. }
    Deposit:
      type: object
      required: [deposit_id, received_at, object_count, depositor]
      properties:
        deposit_id: { type: string, examples: ['dep_0123456789abcdef0123456789abcdef'] }
        received_at: { type: string, description: UTC time the bundle was accepted. }
        object_count: { type: integer, description: Distinct objects the bundle carried. }
        depositor: { $ref: '#/components/schemas/Depositor' }
    ObjectSummaryPage:
      type: object
      required: [total, limit, offset, objects]
      properties:
        total: { type: integer, description: Total matches for the filters, not just this page. }
        limit: { type: integer }
        offset: { type: integer }
        objects:
          type: array
          items:
            type: object
            required: [id, class_name, resolver_url]
            properties:
              id: { type: string, description: 'Canonical dapper CURIE.' }
              class_name: { type: string }
              label: { type: [string, 'null'], description: 'One human-readable line (statement, name, description, metric = value, ...).' }
              times_seen:
                type: integer
                description: >-
                  Deposits plus assertions: for claims, how many times the
                  repository has stood behind this claim in a served result.
              resolver_url: { type: string, description: 'Shareable URL form of the ID (/v1/objects/{id}).' }
