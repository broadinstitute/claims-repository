# Claims repository GraphQL contract — CORE schema (v0.2).
# This file defines only method-agnostic types. Every method (PIGEAN, EAGGL, …)
# contributes its own SDL module under api/graphql/methods/ that `extend`s these
# types; the service concatenates core + registered modules and builds one
# executable schema at startup. Modules may only extend — they never redefine
# core types. See docs/method-modules.md for the design.
#
# Read-only surface: deposit stays on the REST contract (api/openapi.yaml);
# there is deliberately no Mutation type.

schema {
  query: Query
}

type Query {
  health: Health!

  """
  A phenotype by any of its keys: a canonical KPN trait ID
  (KPN.TRAIT:0000505), a legacy portal key (IBD), or a PIGEAN phenotype key —
  resolved through the KPN trait registry (broadinstitute/kpn-data-models).
  """
  phenotype(id: ID!): Phenotype
  phenotypes(search: String, first: Int = 20): [Phenotype!]!

  gene(symbol: ID!): Gene
  """
  A gene set by name. With `phenotype` (any key), the set as that phenotype's
  PIGEAN run observed it — its GeneSet entity, and members default to that
  phenotype; without it, the first observation in (collection, phenotype)
  order.
  """
  geneSet(name: ID!, collection: String, phenotype: ID): GeneSet

  """
  A claim by dapper:Claim ID: a deposited claim, or one the loaded data
  implies — synthesized from its index row, verified, and minted on first
  serve. Every call is an assertion (counted once per request).
  """
  claim(id: ID!): ClaimEnvelope

  """
  A proposition with every claim that assesses it — the fan-in view the
  proposition/claim split exists for: one statement, many assessments
  (measurement, interpretive tiers, other methods). Includes the claims the
  loaded data implies but nothing has served yet: serving them here asserts
  (and on first serve, unless already deposited, mints) them.
  """
  proposition(id: ID!): PropositionEnvelope

  """
  Trace any deposited dapper object by ID (GeneSet, GeneSetCollection,
  Activity, File, ...) — follow provenanceRefs.geneSetRefs or a GeneSet's
  dapperGeneSetId to its full entity record (members, collection backlink,
  creation activity). Returns the verbatim stored document, or null.
  """
  dapperObject(id: ID!): JSON

  "Registered method modules and their metric semantics, for UI rendering."
  methods: [MethodInfo!]!

  """
  The identifier story for clients: the canonical CURIE form, this service's
  resolver URL template (how any dapper ID becomes a shareable link), and the
  dapper prefix expansions — vocabulary namespace (classes/slots) kept
  deliberately distinct from the instance namespace this resolver serves.
  Mirrors /v1/vocabulary's identifier_resolution block.
  """
  identifierResolution: JSON!
}

type Health {
  status: String!
  contractVersion: String!
  "Pinned DAPPER release/commit used for validation, e.g. 0.2.0-a1."
  dapperProfile: String!
}

type MethodInfo {
  "Module name, e.g. pigean."
  name: String!
  "Semantics of every metric the module exposes; mirrors the SDL field docstrings."
  metrics: [MetricSemantics!]!
}

type MetricSemantics {
  "Exact source metric name as it appears in DAPPER ClaimScore.metric, e.g. beta_uncorrected."
  metric: String!
  scoreKind: ScoreKind!
  scale: String!
  better: Better!
  "False until the method leads confirm the interpretation; UIs must render unconfirmed semantics as provisional."
  confirmed: Boolean!
  description: String!
}

"DAPPER ClaimScoreKindEnum."
enum ScoreKind {
  PROBABILITY
  POSTERIOR_PROBABILITY
  EFFECT_ESTIMATE
  LOADING
  SCORE
}

enum Better {
  HIGHER
  LOWER
  NA
  UNCONFIRMED
}

enum SortDir {
  ASC
  DESC
}

"Comparison filter for float metrics; conditions are ANDed."
input FloatFilter {
  lt: Float
  lte: Float
  gt: Float
  gte: Float
  eq: Float
  ne: Float
}

input IntFilter {
  lt: Int
  lte: Int
  gt: Int
  gte: Int
  eq: Int
  ne: Int
}

type Phenotype {
  """
  Canonical KPN trait ID (KPN.TRAIT:…, from broadinstitute/kpn-data-models)
  when the phenotype is registered; otherwise the key as loaded.
  """
  id: ID!
  "Legacy portal trait key the result files use, e.g. IBD."
  legacyId: String
  "KPN trait name, e.g. Inflammatory bowel disease (IBD)."
  name: String
  "Trait group of the loaded result rows, e.g. portal."
  traitGroup: String
  "KPN trait category (registry trait_group), e.g. digestive."
  category: String
  "KPN trait type, e.g. disease, measurement."
  traitType: String
  "Primary ontology concept from the KPN registry, e.g. EFO:0003767."
  conceptId: String
  conceptLabel: String
  "Cross-ontology mappings from the KPN registry (SSSOM), optionally for one ontology (EFO, MONDO, MESH, DOID, HP, ORPHANET, ...)."
  mappings(ontology: String): [TraitMapping!]!
}

"One SSSOM mapping of a KPN trait to an ontology term."
type TraitMapping {
  targetId: ID!
  ontology: String!
  "SKOS / SSSOM predicate, e.g. skos:exactMatch."
  predicate: String!
  label: String
  confidence: Float
  justification: String
  "Where the mapping came from (curated table, EFO cross-reference, ...)."
  source: String
}

type Gene {
  "HGNC symbol as it appears in the result files."
  symbol: ID!
  """
  Gene-set memberships, each backed by its set's roster claim (one claim per
  gene set, from the PIGEAN run's gene_gene_set_stats). Observations are
  phenotype-scoped: pass `phenotype` for one run's (plus collection-wide
  deposited) memberships; without it every observation is listed.
  """
  memberships(collection: String, phenotype: ID, first: Int = 100): [GeneSetMembership!]!
}

type GeneSet {
  "Full gene-set name from the result files."
  name: ID!
  "Upstream source tag, e.g. lincs, geobulk___igvf."
  source: String!
  "Gene-set library of the PIGEAN run (the result files' gene_set_size field), e.g. mouse_msigdb."
  collection: String!
  "dapper:GeneSet ID when known; resolves via provenance-indexer."
  dapperGeneSetId: String
  "Member genes, each backed by its set's roster claim; `phenotype` as on Gene.memberships."
  members(phenotype: ID, first: Int = 100): [GeneSetMembership!]!
}

"A gene's membership in a gene set, backed by the set's roster claim (gene_set has_members, pinning the exact roster) or by a deposited membership claim. No scores in v0; if a method later emits per-membership weights they arrive as LOADING scores on the claim."
type GeneSetMembership {
  gene: Gene!
  geneSet: GeneSet!
  claim: ClaimEnvelope!
}

"""
Shared shape of any method's gene-phenotype association. Concrete per-method
types add their typed metric fields. There is deliberately no cross-method
ordering: order-by enums exist only on concrete method types, so unlike scores
cannot be blended by construction.
"""
interface GenePhenotypeAssociation {
  gene: Gene!
  phenotype: Phenotype!
  collection: String!
  claim: ClaimEnvelope!
}

interface GeneSetPhenotypeAssociation {
  geneSet: GeneSet!
  phenotype: Phenotype!
  collection: String!
  claim: ClaimEnvelope!
}

"""
The lossless DAPPER view of one deposited claim. Typed per-method metric fields
are conveniences; this envelope is the authority and always carries every
deposited score with its metric, kind, and interpretation.
"""
type ClaimEnvelope {
  "dapper:Claim content address (the canonical, location-independent CURIE)."
  id: ID!
  "Shareable URL form of the ID: this service's resolver (/v1/objects/{id}); the CURIE stays canonical."
  resolverUrl: String!
  "Verbatim DAPPER Claim document. A claim served from a live index row is re-synthesized and verified against its content address on every serve. An external deposit is checked for structure and identifier shape; a local-dev id (dapper:{Class}.local<hex>) must hash to its content, a different document at an existing address is refused, and a Claim at an address the loaded data implies must equal the template's synthesis. Full DAPPER-profile validation and DAPPER-ID-1 address verification are Task-5 hardening."
  claim: JSON!
  "Verbatim DAPPER Proposition document."
  proposition: JSON!
  "The proposition's structured (subject, predicate, object), lifted out of the verbatim document for direct rendering."
  triple: ClaimTriple
  scores: [ClaimScore!]!
  """
  Evidence uses on this claim (Claim.has_evidence), dereferenced. For PIGEAN
  measurement claims: one EvidenceItem per metric, grounded by a ValueLocator
  pinning the exact byte span of the number in the result file, re-verifiable
  as file[byte_start : byte_start+byte_length] == value_text under the File's
  sha256.
  """
  evidence: [ClaimEvidence!]!
  """
  Assertion counter: how many times the repository has stood behind this
  claim — +1 for each successful GraphQL response that serves it (a result
  row implying it counts whether or not its envelope is selected; at most
  once per request; the first serve mints it unless a deposit already
  stored it), and +1 per external deposit or re-deposit of the same
  document. Plain document reads (dapperObject, the
  REST resolver) never count. Writes happen only when the whole response
  succeeds; the value shown is as of this response.
  """
  timesDeposited: Int!
  "UTC timestamps of the first mint/deposit and the most recent assertion."
  firstDepositedAt: String
  lastDepositedAt: String
  provenanceRefs: ProvenanceRefs!
}

"One evidence use: the verbatim EvidenceItem document plus its dereferenced ValueLocators."
type ClaimEvidence {
  item: JSON!
  valueLocators: [JSON!]!
}

"A proposition and all of the claims assessing it."
type PropositionEnvelope {
  "dapper:Proposition content address."
  id: ID!
  "Verbatim DAPPER Proposition document."
  proposition: JSON!
  triple: ClaimTriple
  "Every claim assessing this proposition — stored or implied by the loaded data — in claim_id order."
  claims: [ClaimEnvelope!]!
}

"""
The claim's statement as a structured triple, from its Proposition's
subject_entity / relation / object_entity. Subject and object are canonical
IDs: a gene symbol, a phenotype's KPN.TRAIT ID (or its key as loaded when
unregistered), or a dereferenceable dapper ID (dapper:GeneSet for set
associations; dapper:GeneSet has_members dapper:GeneSetCollection for
roster claims) — follow dapper IDs via Query.dapperObject.
"""
type ClaimTriple {
  subject: String!
  predicate: String!
  object: String!
}

type ClaimScore {
  id: ID!
  scoreKind: ScoreKind!
  metric: String!
  value: Float!
  interpretation: String!
}

"References only; resolution belongs to provenance-indexer (Task 6)."
type ProvenanceRefs {
  derivedFromFiles: [String!]!
  geneSetRefs: [String!]!
  resolveVia: String!
  resolution: ProvenanceResolution!
}

enum ProvenanceResolution {
  UNRESOLVED
  RESOLVED
  UNAVAILABLE
}

scalar JSON
