# 7. A trait and its ontology mappings
#
# The KPN trait registry: a trait's id, names, category, and its mappings to
# ontology terms (MONDO, EFO, HP, ...), each with a confidence.
query Trait($phenotype: ID!) {
  phenotype(id: $phenotype) {
    id
    legacyId
    name
    category
    traitType
    conceptId
    conceptLabel
    mappings { targetId ontology predicate label confidence }
  }
}
