# 3. The PIGEAN validation challenge
#
# The strongest PIGEAN genes for IBD that are not explained by their gene sets,
# each with the gene sets that support it most:
# 1. Genes for the trait whose gene-set prior is below 0.5 (mostly direct GWAS
#    support), ordered by combined score, top 20.
# 2. For each gene, its 5 gene sets with the largest marginal effect
#    (beta_uncorrected) for the same trait.
#
# Every setting is a variable with the challenge's value as its default: change
# trait (a KPN.TRAIT id or a PIGEAN key such as IBD or T2D), priorMax,
# topGenes or setsPerGene in the variables pane. Each gene comes with its
# measurement claim (scores and the evidence for each); each gene set with its
# own scores and the roster claim for its members. The query template
# pigean/top-genes-with-sets returns the same rows through runQuery, with
# {trait: "IBD", priorMax: 0.5, topGenes: 20, setsPerGene: 5}.
query ValidationChallenge(
  $trait: String! = "IBD"
  $library: String! = "mouse_msigdb"
  $priorMax: Float = 0.5
  $topGenes: Int = 20
  $setsPerGene: Int = 5
) {
  rows(
    collection: "pigean"
    kind: "gene_phenotype"
    dimensions: [{name: "trait", value: $trait}, {name: "library", value: $library}]
    where: [{metric: "prior", lt: $priorMax}]
    orderBy: {metric: "combined", dir: DESC}
    first: $topGenes
  ) {
    release { version }
    warnings
    rows {
      subject { id value }
      object { id label }
      combined: metric(name: "combined")
      log_bf: metric(name: "log_bf")
      prior: metric(name: "prior")
      claim(key: "measurement") {
        id
        triple { subject predicate object }
        scores { metric value interpretation }
      }
      sets: joined(via: "member_of", kind: "gene_set_phenotype",
                   orderBy: {metric: "beta_uncorrected", dir: DESC}, first: $setsPerGene) {
        row {
          subject { value }
          beta_uncorrected: metric(name: "beta_uncorrected")
          beta: metric(name: "beta")
        }
        edge { claim(key: "roster") { id } }
      }
    }
  }
}
