# 3. Top gene sets for a trait
#
# Gene sets ranked by their marginal effect on the trait (betaUncorrected);
# beta is the effect estimated jointly with the other selected sets.
query TopGeneSets($phenotype: ID!, $first: Int!) {
  phenotype(id: $phenotype) {
    id
    name
    pigeanGeneSetAssociations(orderBy: { field: BETA_UNCORRECTED, dir: DESC }, first: $first) {
      geneSet { name source }
      betaUncorrected
      beta
      claim { id }
    }
  }
}
