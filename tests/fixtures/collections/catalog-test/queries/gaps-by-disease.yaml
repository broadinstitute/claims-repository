query: gaps-by-disease
description: Knowledge gaps about a disease, by name.
params:
  disease:
    type: string
    required: true
    description: The disease, as the IRI gaps name (about_entities) or a key the collection maps, such as CAD.
  first:
    type: integer
    default: 50
    min: 1
    max: 500
plan:
  - anchor:
      class: KnowledgeGap
      where: {disease: {eq: $disease}}
      order: {field: name, dir: asc}
      limit: $first
example:
  disease: CAD
