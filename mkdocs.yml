site_name: Claims Repository
site_description: Documentation for the Broad Institute Claims Repository API service
repo_url: https://github.com/broadinstitute/claims-repository
repo_name: broadinstitute/claims-repository
edit_uri: ""
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Inputs and outputs: inputs-and-outputs.md
  - Collections: collections.md
  - Creating a collection: creating-a-collection.md
  - Publishing a PIGEAN run: publishing-a-pigean-run.md
  - CLI login: cli-login.md
  - Method modules: method-modules.md
  - Graph-query contract design: query-graph-design.md
  - Admin console: admin-console.md

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn

extra_css:
  - assets/docs.css
